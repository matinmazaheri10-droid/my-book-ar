<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Debug</title>
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: #000; color: #fff;
      font-family: sans-serif; font-size: 22px; text-align: center;
      padding: 24px;
    }
    #start small { font-size: 15px; opacity: .7; }
    #status {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(0,0,0,.75); color: #0f0;
      font: 14px monospace; padding: 8px; direction: ltr; text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div id="status">status: page loaded</div>

  <div id="start">
    برای شروع لمس کنید
    <small>سپس دوربین را روی تصویر کتاب بگیرید</small>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="vid" src="./video.mp4" preload="auto" loop playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video src="#vid" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const vid = document.getElementById('vid');
    const target = document.getElementById('target');
    const startBtn = document.getElementById('start');
    const statusEl = document.getElementById('status');

    let lines = [];
    function log(msg) {
      lines.push(msg);
      if (lines.length > 6) lines.shift();
      statusEl.textContent = lines.join('\n');
    }

    // وضعیت ویدیو
    vid.addEventListener('loadeddata', () => log('video: loaded OK'));
    vid.addEventListener('error', () => {
      const e = vid.error;
      log('video: ERROR code=' + (e ? e.code : '?') + ' (4 = file not found or bad format)');
    });

    // وضعیت AR
    scene.addEventListener('arReady', () => log('AR: ready - point camera at image'));
    scene.addEventListener('arError', () => log('AR: ERROR (camera or targets.mind problem)'));

    startBtn.addEventListener('click', () => {
      log('clicked: starting camera...');
      vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});
      scene.systems['mindar-image-system'].start();
      startBtn.style.display = 'none';
    });

    target.addEventListener('targetFound', () => { log('TARGET FOUND'); vid.play(); });
    target.addEventListener('targetLost', () => { log('target lost'); vid.pause(); });
  </script>
</body>
</html>
