<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR</title>
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: #000; color: #fff;
      font-family: sans-serif; font-size: 22px; text-align: center;
      padding: 24px;
    }
    #start small { font-size: 15px; opacity: .7; }
  </style>
</head>
<body>

  <div id="start">
    برای شروع لمس کنید
    <small>گوشی را افقی بچرخانید، به دوربین دسترسی دهید و آن را روی تصویر بگیرید</small>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 1000; missTolerance: 10; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="vid" src="./video.mp4" preload="auto" loop playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- عرض 1 = عرض تصویر چاپی. ارتفاع 0.5625 یعنی نسبت 16:9 -->
      <a-video src="#vid" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const vid = document.getElementById('vid');
    const target = document.getElementById('target');
    const startBtn = document.getElementById('start');

    startBtn.addEventListener('click', () => {
      // اجازه‌ی پخش ویدیو (مرورگر موبایل فقط بعد از لمس اجازه می‌دهد)
      vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});
      scene.systems['mindar-image-system'].start();
      startBtn.style.display = 'none';
    });

    target.addEventListener('targetFound', () => { vid.play(); });
    target.addEventListener('targetLost', () => { vid.pause(); });
  </script>
</body>
</html>
